name: Mandoline
options:
  bundleIdPrefix: com.rowan
  deploymentTarget:
    macOS: 15.0

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.3

targets:
  Mandoline:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: Sparkle
    info:
      path: Info.plist
    settings:
      CODE_SIGN_ENTITLEMENTS: Mandoline.entitlements
      ENABLE_APP_SANDBOX: YES
      ENABLE_USER_SELECTED_FILES: readwrite
      ENABLE_USER_SCRIPT_SANDBOXING: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Custom Info.plist (Info.plist) is used so Sparkle keys (SUFeedURL,
      # SUPublicEDKey, SUEnableInstallerLauncherService) can be set.
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Info.plist
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: 1
      INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
